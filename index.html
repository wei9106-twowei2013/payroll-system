<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>圖威薪資計算</title>
<link rel="apple-touch-icon" href="icon-payroll.png">
<link rel="icon" type="image/png" href="icon-payroll.png">
<meta name="apple-mobile-web-app-title" content="圖威薪資">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：左側員工名冊＋右側工作區；薪資單仿紙本薪資條，數字用複寫紙藍 */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E8EDEC; --ink:#17222A; --muted:#5B686E; --line:#D3DCDB;
  --accent:#2A47A6; --accent-soft:#E5EAF8; --warn:#9A6312; --warn-soft:#FAEFD9; --bad:#B0281F; --bad-soft:#F8E1DE; --good:#2C7A4C; --good-soft:#E1F1E7;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei","微軟正黑體",sans-serif;
  --f-display:var(--f-body);
  --f-num:var(--f-body);
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171A; --surface:#182025; --sunk:#141B1F; --ink:#E3E9EB; --muted:#93A1A7; --line:#2A353B;
  --accent:#93A9F2; --accent-soft:#212B47; --warn:#E3B25D; --warn-soft:#382C15; --bad:#F08A80; --bad-soft:#3B1D1A; --good:#72C795; --good-soft:#18301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171A; --surface:#182025; --sunk:#141B1F; --ink:#E3E9EB; --muted:#93A1A7; --line:#2A353B;
  --accent:#93A9F2; --accent-soft:#212B47; --warn:#E3B25D; --warn-soft:#382C15; --bad:#F08A80; --bad-soft:#3B1D1A; --good:#72C795; --good-soft:#18301F; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.login-box h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.08em}
.login-box p{margin:0;color:var(--muted);font-size:13px}
.login-box label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.login-msg{color:var(--bad);font-size:13px;min-height:1.2em}
.whoami{color:var(--muted);font-size:12.5px}
.hdr-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
body,button,input,select,textarea,table{font-family:var(--f-body)}
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:6px 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.08em}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.12em}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month b{min-width:108px;text-align:center;font-weight:500}
.month button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer}
.month button:hover{background:var(--sunk)}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:var(--r);cursor:pointer;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--sunk);color:var(--ink)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:14px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.roster{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:1180px){aside.roster{position:static;flex-direction:row;flex-wrap:wrap}}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:9px 11px;border-radius:var(--r);cursor:pointer}
@media (max-width:1180px){.who{width:auto}}
.who:hover{background:var(--surface);border-color:var(--line)}
.who[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.who .n{font-weight:500}.who .t{display:block;font-size:12px;color:var(--muted)}
.who .v{font-size:12.5px;color:var(--accent)}
.side-actions{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
@media (max-width:1180px){.side-actions{flex-direction:row;border:0;margin:0;padding:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.ph h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
.ph h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.emp-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.emp-head h2{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.06em}
.emp-head .meta{color:var(--muted);font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:22px}
.kpi span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.kpi b{font-family:var(--f-num);font-size:18px;font-weight:500}
.kpi.net b{color:var(--accent);font-size:22px}
.flags{display:flex;flex-direction:column;gap:4px;margin:0 0 14px;padding:0;list-style:none}
.flags li{padding:6px 10px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.flags li.bad{background:var(--bad-soft);color:var(--bad)}
.tscroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.days{border-collapse:collapse;width:100%;min-width:900px;font-size:13px;table-layout:fixed}
/* 欄寬：日期 類型 上班 下班 加班起 加班迄 休息 假別 時數 外勤 供餐 補休 備註(其餘) 加班/出勤 加班費 遲到 提醒 */
table.days th:nth-child(1){width:54px}table.days th:nth-child(2){width:64px}
table.days th:nth-child(3),table.days th:nth-child(4),table.days th:nth-child(5),table.days th:nth-child(6){width:54px}
table.days th:nth-child(7){width:38px}table.days th:nth-child(8){width:74px}table.days th:nth-child(9){width:38px}
table.days th:nth-child(10),table.days th:nth-child(11),table.days th:nth-child(12){width:30px;text-align:center}
table.days th:nth-child(14){width:58px}table.days th:nth-child(15){width:60px}table.days th:nth-child(16){width:42px}table.days th:nth-child(17){width:18px}
table.days td{overflow:hidden}
table.days .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.days th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:6px 3px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.days td{padding:3px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
table.days tr.off td{background:var(--sunk)}
table.days td.c{text-align:right;white-space:nowrap}
table.days .grp{border-left:2px solid var(--line);padding-left:5px}
.ti{width:100%;padding:4px 4px;border:1px solid transparent;border-radius:4px;background:transparent;font-family:var(--f-num);font-size:13px}
.ti:hover{border-color:var(--line)} .ti:focus{border-color:var(--accent);background:var(--surface);outline:none}
.ti.w40{width:100%}.ti.wnote{width:100%;min-width:0;font-family:var(--f-body)}
select.ti{width:100%;font-family:var(--f-body);padding-right:0}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.chip.work{color:var(--muted)} .chip.rest{background:var(--accent-soft);color:var(--accent)}
.chip.regular{background:var(--bad-soft);color:var(--bad)} .chip.holiday{background:var(--warn-soft);color:var(--warn)}
.dt{font-family:var(--f-num);white-space:nowrap}.dt i{font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:12px;margin-left:4px}
.warnmark{color:var(--warn);cursor:help}
td.money{color:var(--accent)}
.cb{display:flex;align-items:center;justify-content:center;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;margin-top:10px}
/* 薪資單 */
.slip{border:1px solid var(--ink);max-width:880px}
.slip .sh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ink)}
.slip .sh .ttl{font-family:var(--f-display);font-size:19px;letter-spacing:.12em;text-align:center}
.slip .sh .r{text-align:right}
.slip table{width:100%;border-collapse:collapse;font-size:13.5px}
.slip th,.slip td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.slip th{font-weight:500;background:var(--sunk);font-size:12.5px}
.slip td.amt{text-align:right;font-family:var(--f-num);color:var(--accent);white-space:nowrap}
.slip td.rm{color:var(--muted);font-size:12px;max-width:220px}
.slip .mid{border-left:1px solid var(--ink)}
.slip tr.sum td{border-top:1px solid var(--ink);font-weight:700}
.slip .total{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;padding:10px 14px;border-top:1px solid var(--ink)}
.slip .total b{font-family:var(--f-num);font-size:22px;color:var(--accent)}
.slip .snote{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:8px 14px;border-top:1px solid var(--line);min-height:40px;font-size:13px}
.slip .snote .k{color:var(--muted);font-size:12.5px;padding-top:1px}
.slip .snote .v{white-space:pre-wrap;overflow-wrap:anywhere}
.note-edit{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:12px;max-width:880px}
.note-edit .hint{margin-left:0}
.note-edit textarea.fi{min-height:56px;font-size:13.5px;color:var(--ink);resize:vertical}
.slip .sign{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.slip-wrap{overflow-x:auto}
.slip-inner{min-width:640px}
/* 加扣項 */
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.xrow{display:grid;grid-template-columns:minmax(0,1.1fr) 96px minmax(0,1.6fr) 28px;gap:6px;align-items:center;margin-bottom:6px}
.fi{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.fi:focus{border-color:var(--accent);outline:none}
.fi.num{text-align:right}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.helper{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.helper .fi{width:70px}
.employer{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted)}
.employer b{font-family:var(--f-num);color:var(--ink);font-weight:500}
/* 表單 */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.items .xrow{grid-template-columns:minmax(0,1fr) 110px 120px 110px 28px}
@media (max-width:560px){.items .xrow{grid-template-columns:1fr 1fr}.xrow{grid-template-columns:1fr 1fr}}
table.sum{border-collapse:collapse;width:100%;min-width:860px;font-size:13.5px}
table.sum th,table.sum td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.sum th{font-weight:500;color:var(--muted);font-size:12.5px}
table.sum th:first-child,table.sum td:first-child{text-align:left}
table.sum tr.tot td{font-weight:700;border-top:1px solid var(--ink)}
table.sum td.net{color:var(--accent)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rule{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rule h4{margin:0 0 6px;font-size:14px}
.rule p,.rule ul{margin:0;color:var(--muted);font-size:13px}
.rule ul{padding-left:18px}
.rule .law{font-family:var(--f-num);font-size:11.5px;color:var(--accent);letter-spacing:.04em}
textarea.fi{min-height:220px;font-size:13px}
textarea.fi.small-ta{min-height:150px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* 本月加扣項 */
.adj{min-width:0}
.adj-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.adj-h h3{margin:0;font-size:14px;color:var(--ink);font-weight:700}
.adj-h b{font-size:16px;color:var(--accent);font-weight:500}
.adj-cols,.adj .xrow{display:grid;grid-template-columns:minmax(0,1.15fr) 72px 92px minmax(0,1.4fr) 28px;gap:6px;align-items:center}
.adj-cols{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.adj .xrow{margin-bottom:5px}
.adj .lbl{font-weight:500;min-width:0;overflow-wrap:anywhere}
.adj .lbl em{font-style:normal;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 6px;margin-left:6px;font-weight:400}
.adj .auto{color:var(--muted);text-align:right;font-size:13px}
.adj .xrow.ovr input[data-k="amount"]{border-color:var(--warn);background:var(--warn-soft)}
.adj .xrow.sys input[data-k="amount"]::placeholder{color:var(--muted);opacity:.55;font-size:12.5px}
.adj .xrow.sys input[data-k="amount"]:hover{border-color:var(--accent)}
.adj .xrow.ext{padding-top:5px;border-top:1px dashed var(--line)}
.adj .xrow.ext + .xrow.ext{border-top:0;padding-top:0}
.cb2{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.btn.dashed{border-style:dashed;color:var(--muted)}
@media (max-width:560px){.adj-cols{display:none}.adj .xrow{grid-template-columns:1fr 1fr}.adj .xrow .lbl{grid-column:1/-1}}
/* 班表 */
.seg{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.inspick{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.inspick label.chk{display:flex;align-items:center;gap:6px;font-size:13.5px}
.inspick label .num{color:var(--muted);font-size:12.5px}
.inssum{flex-basis:100%;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.inssum b{color:var(--accent);font-weight:500}
.seg label{display:flex;align-items:center;gap:6px;cursor:pointer}
.sched{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.sv-h,.sv-row{display:grid;grid-template-columns:130px repeat(5,78px) 110px 28px;gap:6px;align-items:center;min-width:760px}
.sched.ext .sv-h,.sched.ext .sv-row{grid-template-columns:118px repeat(9,68px) 96px 28px;min-width:950px}
.sched .fi.opt{border-style:dashed}
.sched .sv-h span{white-space:nowrap;line-height:1.25}
.sv-segs{grid-column:1/-1;font-size:12.5px;color:var(--muted);padding:2px 2px 0}
.sv-h{font-size:11.5px;color:var(--muted)}
.sv-row{padding:6px;border:1px solid var(--line);border-radius:var(--r)}
.sv-row.cur{border-color:var(--accent)}
.sv-row em{font-style:normal;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 6px}
.sv-row .badtxt{color:var(--bad);font-weight:700}
.sv-warn{grid-column:1/-1;margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.sv-warn li{font-size:12.5px;color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:4px 8px}
.sched > .btn{align-self:flex-start;margin-top:4px}
/* PDF 匯出：固定淺色、固定寬度，畫在畫面外 */
.pdf-stage{position:fixed;left:-12000px;top:0;width:880px;padding:0;background:#fff;
  --bg:#FFFFFF;--surface:#FFFFFF;--sunk:#E8EDEC;--ink:#17222A;--muted:#5B686E;--line:#D3DCDB;--accent:#2A47A6;color:#17222A;color-scheme:light}
.pdf-stage .slip{max-width:none;background:#fff}
.pdf-stage .slip th,.pdf-stage .slip td,.pdf-stage .slip div,.pdf-stage .slip span{color:#17222A}
.pdf-stage .slip th{background:#E8EDEC}
.pdf-stage .slip td.amt,.pdf-stage .slip .total b{color:#2A47A6}
.pdf-stage .slip td.rm,.pdf-stage .slip .sign span,.pdf-stage .slip .snote .k{color:#5B686E}
#printArea{display:none}
@media print{
  body.printing > *:not(#printArea){display:none!important}
  body.printing{background:#fff}
  body.printing #printArea{display:block;--bg:#fff;--surface:#fff;--sunk:#E8EDEC;--ink:#17222A;--muted:#5B686E;--line:#D3DCDB;--accent:#2A47A6;color:#17222A}
  body.printing .print-page{break-after:page;page-break-after:always}
  body.printing .print-page:last-child{break-after:auto;page-break-after:auto}
  body.printing .slip{max-width:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:12mm}
}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lvgrid div{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.lvgrid span{display:block;font-size:12px;color:var(--muted)}
.lvgrid b{font-weight:500;font-variant-numeric:tabular-nums}
.lvgrid b.acc{color:var(--accent)}
.helper.lvinfo{gap:6px 18px}
.helper.lvinfo b{color:var(--ink);font-weight:500}
.helper .settle{color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:4px}

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
/* 圖威薪資計算核心：純函式，頁面與測試共用 */
const PAYCALC = (() => {
  const pad = n => String(n).padStart(2, '0');
  const toMin = s => {
    if (s == null || s === '') return null;
    if (typeof s === 'number') return s;
    const m = /^(\d{1,2}):(\d{2})/.exec(String(s).trim());
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  };
  const fmtMin = m => { if (m == null) return ''; m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const dur = m => { m = Math.round(m || 0); return Math.floor(m / 60) + ':' + pad(m % 60); };
  const hrs = m => Math.round((m || 0) / 60 * 100) / 100;
  const overlap = (a, b, c, d) => Math.max(0, Math.min(b, d) - Math.max(a, c));

  const LABOR_TABLE = [29500, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800];
  const HEALTH_TABLE = [29500, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800, 48200, 50600, 53000, 55400, 57800, 60800, 63800, 66800, 69800, 72800, 76500, 80200, 83900, 87600, 92100, 96600, 101100, 105600, 110100, 115500, 120900, 126300, 131700, 137100, 142500, 147900, 150000, 156400, 162800, 169200, 175600, 182000, 189500, 197000, 204500, 212000, 219500, 228200, 236900, 245600, 254300, 263000, 273000, 283000, 293000, 303000, 313000];
  /* 勞保費：普通事故與就業保險分開計算、各自四捨五入（同勞保局保費表） */
  const r2 = x => Math.round(Math.round(x * 1e6) / 1e6);
  const laborDue = (wage, S, share) => { const job = S.laborJob ?? 1; return r2(wage * (S.laborRate - job) / 100 * share / 100) + r2(wage * job / 100 * share / 100); };
  const bracket = (table, wage) => { for (const v of table) if (wage <= v) return v; return table[table.length - 1]; };
  /* 投保金額：手動填寫，或依勾選的固定薪資項目加總後對應級距 */
  function insured(emp) {
    if (emp && emp.insMode === 'auto') {
      const picked = (emp.items || []).filter(i => i.ins);
      const wage = picked.reduce((a, i) => a + (+i.amount || 0), 0);
      return { auto: true, wage, picked: picked.map(i => i.label), labor: bracket(LABOR_TABLE, wage), health: bracket(HEALTH_TABLE, wage), pension: Math.min(150000, bracket(HEALTH_TABLE, wage)) };
    }
    return { auto: false, labor: +(emp && emp.labor) || 0, health: +(emp && emp.health) || 0, pension: +(emp && emp.pension) || 0 };
  }

  const LEAVES = {
    '特休': { pay: 1, att: false }, '補休': { pay: 1, att: false }, '公假': { pay: 1, att: false },
    '婚假': { pay: 1, att: false }, '喪假': { pay: 1, att: false }, '其他有薪': { pay: 1, att: false },
    '病假': { pay: 0.5, att: 'sick' }, '生理假': { pay: 0.5, att: false },
    '事假': { pay: 0, att: true }, '家庭照顧假': { pay: 0, att: false }, '颱風假': { pay: 0, att: false }
  };

  const DEFAULT_SETTINGS = {
    company: '圖威', manager: '周俊偉', accountant: '呂惠萍',
    schedules: [
      { from: '2000-01-01', start: '08:00', ls: '12:00', le: '13:30', end: '17:30', ot: '17:30' }
    ],
    wd1: 1.34, wd2: 1.67, rd1: 1.34, rd2: 1.67, rd3: 2.67,
    unit: 1, grace: 0, lateMode: 'fixed', latePerMin: 1,
    lateFreeMin: 15, lateKillsAtt: true, lateDeductOver: true,
    mealPerDay: 60, mealInBase: false,
    fuelKmPerL: 12, fuelPrice: 32, maintPerKm: 0.5,
    laborRate: 12.5, laborJob: 1, laborEmp: 20, laborEr: 70,
    healthRate: 5.17, healthEmp: 30, healthEr: 60, healthAvgDep: 0.56,
    pensionEr: 6, otCap: 46,
    fieldWords: '佈展,卸展,施工,監工,出差',
    mealWords: '佈展,卸展,施工',
    quickEarn: ['全勤獎金', '非經常性專案獎金', '中秋節禮金', '端午節禮金', '年終獎金', '代墊金額', '特休假換薪資', '出差油資費補助', '過路費', '出差私車保養補助', '停車費'],
    quickDed: ['預支', '代扣款', '其他'],
    holidays: [
      ['2026-01-01', '開國紀念日'], ['2026-02-16', '除夕'], ['2026-02-17', '春節'], ['2026-02-18', '春節'],
      ['2026-02-19', '春節'], ['2026-02-20', '小年夜補假'], ['2026-02-27', '和平紀念日補假'],
      ['2026-04-03', '兒童節補假'], ['2026-04-06', '清明節補假'], ['2026-05-01', '勞動節'],
      ['2026-06-19', '端午節'], ['2026-09-25', '中秋節'], ['2026-09-28', '教師節'],
      ['2026-10-09', '國慶日補假'], ['2026-10-26', '光復節補假'], ['2026-12-25', '行憲紀念日']
    ]
  };

  /* 班表 */
  /* 班表：上午 start–ls；下午 le–end，中途可離開／回來兩次（b1s–b1e、b2s–b2e 不計薪） */
  const normSched = v => {
    // 舊格式（下午第 2、3 段 p2s/p2e/p3s/p3e）轉成離開／回來
    if (v && (v.p2s || v.p2e || v.p3s || v.p3e)) {
      const t = toMin, okP2 = v.p2s && v.p2e && t(v.end) <= t(v.p2s) && t(v.p2s) < t(v.p2e);
      const okP3 = okP2 && v.p3s && v.p3e && t(v.p2e) <= t(v.p3s) && t(v.p3s) < t(v.p3e);
      if (okP2) { v.b1s = v.end; v.b1e = v.p2s; v.end = v.p2e; }
      if (okP3) { v.b2s = v.end; v.b2e = v.p3s; v.end = v.p3e; }
      delete v.p2s; delete v.p2e; delete v.p3s; delete v.p3e;
      if (!okP2 && toMin(v.ot) > toMin(v.end)) v.ot = v.end;
    }
    return v;
  };
  const schedInfo = v0 => {
    const v = normSched({ ...v0 });
    const s = toMin(v.start), ls = toMin(v.ls), le = toMin(v.le), end = toMin(v.end);
    const warn = [];
    const segs = [['上午', s, ls]];
    let cur = le, k = 1;
    [['b1s', 'b1e', 1], ['b2s', 'b2e', 2]].forEach(([a, b, n]) => {
      const x = toMin(v[a]), y = toMin(v[b]);
      if ((x == null) !== (y == null)) { warn.push(`外出 ${n} 要同時填外出和外出回來時間`); return; }
      if (x == null) return;
      if (!(x > cur)) warn.push(`外出 ${n} 的時間要晚於${k === 1 ? '午休結束' : '前一次外出回來'}`);
      if (!(y > x)) warn.push(`外出回來 ${n} 的時間要晚於外出 ${n}`);
      segs.push([`下午第 ${k} 段`, cur, x]); cur = y; k++;
    });
    segs.push([k === 1 ? '下午' : `下午第 ${k} 段`, cur, end]);
    if (!(end > cur)) warn.push(`下班時間要晚於${k === 1 ? '午休結束' : '最後一次外出回來'}`);
    if (!(ls > s)) warn.push('午休開始要晚於上班時間');
    const e = end;
    const ot = toMin(v.ot) ?? e;
    const lens = segs.map(([n, a, b]) => [n, Math.max(0, b - a)]);
    const normal = lens.reduce((t, x) => t + x[1], 0);
    const gaps = segs.slice(1).map((x, i) => [segs[i][2], x[1]]).filter(([a, b]) => b > a);
    const am = lens[0][1], pm = lens.slice(1).reduce((t, x) => t + x[1], 0), lunch = Math.max(0, le - ls);
    if (normal > 480) warn.push(`正常工時 ${dur(normal)}，超過每日 8 小時（§30），超出的 ${normal - 480} 分鐘每天自動按平日加班計`);
    lens.filter(x => x[1] > 240).forEach(([n, m]) => warn.push(`${n}連續工作 ${dur(m)}，超過 4 小時須至少休息 30 分鐘（§35）`));
    if (ot > e) warn.push(`${fmtMin(e)} 下班到 ${v.ot} 加班起算之間須讓員工實際休息，期間若在工作仍應計加班`);
    if (ot < e) warn.push('加班起算時間早於下班時間');
    if (lunch < 30 && am + pm > 240) warn.push('午休少於 30 分鐘（§35）');
    return { s, ls, le, e, ot, normal, am, pm, lunch, segs, gaps, warn };
  };
  const schedList = (emp, S) => (emp && emp.schedMode === 'custom' && emp.scheds && emp.scheds.length) ? emp.scheds : (S.schedules || DEFAULT_SETTINGS.schedules);
  const schedFor = (emp, date, S) => {
    const list = [...schedList(emp, S)].sort((a, b) => a.from.localeCompare(b.from));
    let v = list[0]; for (const x of list) if (x.from <= date) v = x;
    return v;
  };
  const schedLabel = v => schedInfo(v).segs.map(([, a, b]) => `${fmtMin(a)}–${fmtMin(b)}`).join('、');

  /* 舊資料（start/end/brk/ot）轉成班表版本 */
  function migrateEmp(emp) {
    if (!emp || emp.type === 'contractor') return emp;
    if (!emp.scheds) {
      const o = emp.sched || {};
      const start = o.start || '08:00', end = o.end || '17:30', brk = +o.brk || 90;
      const same = start === '08:00' && end === '17:30';
      emp.schedMode = same ? 'company' : 'custom';
      emp.scheds = [{ from: '2000-01-01', start, ls: '12:00', le: fmtMin(720 + brk), end, ot: end }];
    }
    emp.schedMode = emp.schedMode || 'company';
    (emp.scheds || []).forEach(normSched);
    if (!emp.mealMode) emp.mealMode = emp.meal === false ? 'none' : 'daily';
    // 固定項目一律有「專業加給」，接在底薪（或月薪）後面
    emp.items = Array.isArray(emp.items) ? emp.items : [];
    if (!emp.items.some(i => i.label === '專業加給')) {
      const at = emp.items.findIndex(i => i.label === '底薪' || i.label === '月薪');
      emp.items.splice(at >= 0 ? at + 1 : 0, 0, { label: '專業加給', amount: 0, base: true, kind: 'fixed' });
    }
    return emp;
  }


  /* 年資與特休（勞基法 §38，依到職日週年制） */
  const addMonthsStr = (d, n) => { const [y, m, dd] = d.split('-').map(Number); const t = new Date(y, m - 1 + n, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(Math.min(dd, last))}`; };
  const prevDay = d => { const [y, m, dd] = d.split('-').map(Number); const t = new Date(y, m - 1, dd - 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
  const leaveDaysFor = n => n < 1 ? 3 : n === 1 ? 7 : n === 2 ? 10 : n < 5 ? 14 : n < 10 ? 15 : Math.min(30, 15 + (n - 9));
  function seniority(hire, asOf) {
    if (!hire || !/^\d{4}-\d{2}-\d{2}$/.test(hire) || asOf < hire) return null;
    let months = 0; while (addMonthsStr(hire, months + 1) <= asOf) months++;
    return { years: Math.floor(months / 12), months: months % 12, totalMonths: months };
  }
  function annualLeave(hire, asOf) {
    const sv = seniority(hire, asOf); if (!sv) return null;
    if (sv.totalMonths < 6) return { ...sv, days: 0, start: null, end: null, next: addMonthsStr(hire, 6), nextDays: 3 };
    let start, endEx, days;
    if (sv.totalMonths < 12) { start = addMonthsStr(hire, 6); endEx = addMonthsStr(hire, 12); days = 3; }
    else { const n = sv.years; start = addMonthsStr(hire, n * 12); endEx = addMonthsStr(hire, (n + 1) * 12); days = leaveDaysFor(n); }
    const nextYears = sv.totalMonths < 12 ? 1 : sv.years + 1;
    return { ...sv, days, start, end: prevDay(endEx), endEx, next: endEx, nextDays: leaveDaysFor(nextYears) };
  }

  const newEmployee = (name, id) => ({
    id: id || ('e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
    name: name || '新員工', title: '', order: 99, active: true,
    items: [{ label: '底薪', amount: 30000, base: true, kind: 'fixed' }, { label: '專業加給', amount: 0, base: true, kind: 'fixed' }, { label: '全勤獎金', amount: 0, base: true, kind: 'attendance' }],
    labor: 29500, health: 29500, pension: 29500, deps: 0, selfPension: 0, sickYtdH: 0, mealMode: 'daily', mealPerDay: '', mealFixed: 0, hire: '',
    schedMode: 'company', scheds: [{ from: '2000-01-01', start: '08:00', ls: '12:00', le: '13:00', end: '17:00', ot: '17:00' }]
  });

  const daysOfMonth = month => { const [y, m] = month.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${month}-${pad(i + 1)}`); };
  const dow = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).getDay(); };
  const dayType = (d, holMap) => holMap[d] ? 'holiday' : (dow(d) === 6 ? 'rest' : dow(d) === 0 ? 'regular' : 'work');
  const TYPE_NAME = { work: '工作日', rest: '休息日', regular: '例假日', holiday: '國定假日' };
  const tiers = (m, bands) => { let left = m, mult = 0; for (const [len, r] of bands) { const t = Math.min(left, len); mult += t * r; left -= t; if (left <= 0) break; } return mult / 60; };
  const floorU = (m, u) => Math.max(0, Math.floor(m / (u || 1)) * (u || 1));

  function span(day, si) {
    let s = toMin(day.os), e = toMin(day.oe), rest = +day.rest || 0, fromPunch = false;
    if (s == null || e == null) { s = toMin(day.in); e = toMin(day.out); fromPunch = true; }
    if (s == null || e == null) return 0;
    if (e <= s) e += 1440;
    if (fromPunch && !day.rest) rest = si.gaps.reduce((t, [a, b]) => t + overlap(s, e, a, b), 0);
    return Math.max(0, e - s - rest);
  }

  function computeMonth(emp0, month, rec, S) {
    S = Object.assign({}, DEFAULT_SETTINGS, S || {});
    const emp = migrateEmp(JSON.parse(JSON.stringify(emp0 || {})));
    const holMap = {}; (S.holidays || []).forEach(([d, n]) => { holMap[d] = n || '國定假日'; });
    const days = (rec && rec.days) || {};
    const ovr = (rec && rec.ovr) || {};
    const actual = !!(rec && rec.format === 'home');
    const rows = []; const flags = [];
    let workdays = 0, mealDays = 0, lateMin = 0, unpaidH = 0, halfH = 0, attH = 0, sickH = 0, compMin = 0, capMin = 0, excessMin = 0;
    const otMin = { work: 0, rest: 0, regular: 0, holiday: 0 };
    const leaveList = {}; const usedScheds = new Map();

    for (const d of daysOfMonth(month)) {
      const day = days[d] || {}; const type = dayType(d, holMap);
      const v = schedFor(emp, d, S); const si = schedInfo(v);
      const r = { d, type, hol: holMap[d] || '', day, ot: 0, excess: 0, late: 0, mult: 0, dayPay: false, warn: [], sched: v };
      const lv = day.leave && LEAVES[day.leave] ? day.leave : '';
      const lvH = lv ? (+day.leaveH || 8) : 0;
      if (lv) { (leaveList[lv] = leaveList[lv] || []).push(+d.slice(5, 7) + '/' + +d.slice(8) + (lvH !== 8 ? `(${lvH}h)` : '')); }
      if (type === 'work') {
        workdays++;
        usedScheds.set(JSON.stringify(v), v);
        if (lv) { const L = LEAVES[lv]; if (L.pay === 0) unpaidH += lvH; else if (L.pay === 0.5) halfH += lvH; if (L.att === true) attH += lvH; if (L.att === 'sick') sickH += lvH; }
        const tin = toMin(day.in), tout = toMin(day.out);
        if (actual) {
          // 在家版：依當天實際的上下班、午休、外出時間計算
          const brks = [[day.ls, day.le], [day.b1s, day.b1e]].map(([a, b]) => [toMin(a), toMin(b)]).filter(([a, b]) => a != null && b != null && b > a);
          const os0 = toMin(day.os);
          let endN = null;
          if (tin != null && tout != null) { endN = tout >= tin ? tout : tout + 1440; if (os0 != null) endN = Math.min(endN, os0 >= tin ? os0 : os0 + 1440); }
          const workedN = endN != null ? Math.max(0, endN - tin - brks.reduce((t, [a, b]) => t + overlap(tin, endN, a, b), 0)) : 0;
          const target = Math.max(0, si.normal - (lv ? lvH * 60 : 0));
          const late = tin != null && !day.field && !(lv && lvH < 8) ? Math.max(0, tin - (si.s + (+S.grace || 0))) : 0;
          const early = tin != null && !day.field && !(lv && lvH >= 8) ? Math.max(0, target - workedN - late) : 0;
          r.late += late + early; r.worked = workedN;
          if (tin != null && os0 == null && workedN > si.normal + 30) r.warn.push(`實際工作 ${dur(workedN)}，超過應工作 ${dur(si.normal)}；若有加班請填加班開始／結束`);
          if (os0 != null && workedN > si.normal + 30) r.warn.push(`加班開始前已工作 ${dur(workedN)}，多出的 ${workedN - si.normal} 分鐘未計加班，請確認`);
        } else {
          if (tin != null && !day.field && !(lv && lvH < 8)) r.late += Math.max(0, tin - (si.s + (+S.grace || 0)));
          if (tout != null && !day.field && !lv && toMin(day.os) == null && tout < si.e) r.late += si.e - tout;
        }
        lateMin += r.late;
        if (tin == null && !lv && !day.field) r.warn.push('無打卡紀錄，請填假別');
        if (emp.mealMode === 'field') { if (day.field && !day.meal && lvH < 8) mealDays++; }
        else if ((tin != null || day.field) && lvH < 8 && emp.mealMode !== 'none' && !day.meal) mealDays++;
        // 正常工時超過 8 小時的部分（§30）
        let worked = 0;
        if (actual) worked = 0;
        else if (tin != null && tout != null) { const a = Math.max(tin, si.s), b = Math.min(tout >= tin ? tout : tout + 1440, si.e); worked = si.segs.reduce((t, [, x, y]) => t + overlap(a, b, x, y), 0); }
        else if (day.field && !lv) worked = si.normal;
        r.excess = Math.max(0, worked - 480);
        // 下班後加班
        let evening = 0;
        let s = toMin(day.os), e = toMin(day.oe);
        if (actual) { if (s != null && e != null) { if (e < s) e += 1440; evening = Math.max(0, e - s - (+day.rest || 0)); } }
        else {
          if (s == null && e == null && tout != null && tout > si.ot) { s = si.ot; e = tout; }
          if (s == null && e != null) s = si.ot;
          if (s != null && e != null) { if (e < s) e += 1440; evening = Math.max(0, e - Math.max(s, si.ot) - (+day.rest || 0)); }
        }
        r.ot = floorU(r.excess + evening, S.unit);
        if (r.ot > 0) {
          capMin += r.ot; excessMin += r.excess;
          if (480 + r.ot > 720) r.warn.push('單日工時逾 12 小時（§32）');
          if (day.comp) { compMin += r.ot; r.mult = 0; }
          else { r.mult = tiers(r.ot, [[120, S.wd1], [Infinity, S.wd2]]); otMin.work += r.ot; }
        }
      } else {
        const m = floorU(span(day, si), S.unit);
        if (emp.mealMode === 'field' && day.field && !day.meal && (m > 0 || day.in || day.os)) mealDays++;
        r.ot = m;
        if (m > 0) {
          if (type === 'rest') {
            capMin += m;
            if (m > 720) r.warn.push('休息日工作逾 12 小時（§32）');
            if (day.comp) { compMin += m; } else { r.mult = tiers(m, [[120, S.rd1], [360, S.rd2], [Infinity, S.rd3]]); otMin.rest += m; }
          } else {
            r.dayPay = true;
            const over = Math.max(0, m - 480); capMin += over;
            r.mult = tiers(over, [[120, S.wd1], [Infinity, S.wd2]]);
            otMin[type] += m;
            if (m > 720) r.warn.push('單日工時逾 12 小時（§32）');
            if (type === 'regular') r.warn.push('例假出勤限天災、事變或突發事件（§40），須事後補假 1 日');
          }
        }
      }
      rows.push(r);
    }

    // 全勤：事假與一年逾 10 日之病假按比例扣
    const sickFree = Math.max(0, 80 - (+emp.sickYtdH || 0));
    const attLossH = attH + Math.max(0, sickH - sickFree);
    const totalH = Math.max(1, workdays * 8);
    const lateFree = +S.lateFreeMin || 0;
    const lateOver = lateMin > lateFree;
    const attGone = lateOver && S.lateKillsAtt !== false;
    const attGoneRemark = `遲到早退 ${lateMin} 分鐘，超過 ${lateFree} 分鐘，本月無全勤`;
    const O = (key, auto) => (ovr[key] && ovr[key].amount != null && ovr[key].amount !== '') ? +ovr[key].amount : auto;
    const R_ = (key, auto) => (ovr[key] && ovr[key].remark != null && ovr[key].remark !== '') ? ovr[key].remark : auto;

    // 應支：固定項目（可覆寫）
    const earnings = [];
    (emp.items || []).forEach(i => {
      const key = 'i:' + i.label;
      let auto = +i.amount || 0, remark = '';
      if (i.kind === 'attendance') {
        if (attGone) { auto = 0; remark = attGoneRemark; }
        else { const lost = Math.round(auto * Math.min(1, attLossH / totalH)); auto -= lost; if (lost) remark = `請假按比例扣 ${lost} 元`; }
      }
      earnings.push({ key, label: i.label, auto, amount: O(key, auto), autoRemark: remark, remark: R_(key, remark), base: !!i.base, kind: i.kind || 'fixed', overridden: O(key, auto) !== auto });
    });
    const extras = ((rec && rec.extras) || []).map((x, idx) => {
      const e = { key: 'x' + idx, idx, label: x.label, amount: +x.amount || 0, entered: +x.amount || 0, remark: x.remark || '', origRemark: x.remark || '', base: !!x.base, extra: true };
      if (attGone && /全勤/.test(x.label || '') && e.amount) { e.amount = 0; e.remark = attGoneRemark; e.attGone = true; }
      return e;
    });

    const mealPer = (emp.mealPerDay !== '' && emp.mealPerDay != null) ? +emp.mealPerDay : (+S.mealPerDay || 0);
    const mealAuto = emp.mealMode === 'none' ? 0 : emp.mealMode === 'fixed' ? (+emp.mealFixed || 0) : mealDays * mealPer;
    const mealAmt = O('meal', mealAuto);
    let base = earnings.filter(x => x.base).reduce((a, x) => a + x.amount, 0) + extras.filter(x => x.base).reduce((a, x) => a + x.amount, 0);
    if (S.mealInBase) base += mealAmt;
    const R = base / 240, dayWage = base / 30;
    let otAuto = 0;
    rows.forEach(r => { r.pay = r.mult * R + (r.dayPay ? dayWage : 0); otAuto += r.pay; });
    otAuto = Math.round(otAuto);
    const otPay = O('ot', otAuto);

    const otParts = [];
    if (otMin.work) otParts.push(`平日 ${dur(otMin.work)}${excessMin ? `（含正常工時超出 ${dur(excessMin)}）` : ''}`);
    if (otMin.rest) otParts.push(`休息日 ${dur(otMin.rest)}`);
    if (otMin.holiday) otParts.push(`國定假日 ${dur(otMin.holiday)}`);
    if (otMin.regular) otParts.push(`例假日 ${dur(otMin.regular)}`);
    if (compMin) otParts.push(`選擇補休 ${dur(compMin)}`);
    const otRemark = otParts.join('、');
    earnings.push({ key: 'ot', label: '加班費', auto: otAuto, amount: otPay, autoRemark: otRemark, remark: R_('ot', otRemark), overridden: otPay !== otAuto });
    if (emp.mealMode !== 'none') { const mr = emp.mealMode === 'fixed' ? '每月固定' : emp.mealMode === 'field' ? `外勤 ${mealDays} 天 × ${mealPer} 元` : `${mealDays} 天 × ${mealPer} 元`; earnings.push({ key: 'meal', label: '餐費', auto: mealAuto, amount: mealAmt, autoRemark: mr, remark: R_('meal', mr), overridden: mealAmt !== mealAuto }); }
    // 出差：油資、過路費、私車保養補助（依每日里程與過路費）
    const tc = Object.assign({ kmPerL: +S.fuelKmPerL || 12, price: +S.fuelPrice || 32, maintPerKm: +S.maintPerKm || 0 }, Object.fromEntries(Object.entries((rec && rec.tripCfg) || {}).filter(([, v]) => v != null && v !== '')));
    let km = 0, toll = 0, trips = 0;
    Object.entries(days).forEach(([d, x]) => { if (d.startsWith(month) && x.trip) { km += +x.trip.km || 0; toll += +x.trip.toll || 0; if (x.trip.km || x.trip.toll || x.trip.to) trips++; } });
    const trip = { km, toll, trips, cfg: tc, fuel: tc.kmPerL ? Math.round(km / tc.kmPerL * tc.price) : 0, maint: Math.round(km * tc.maintPerKm) };
    const addE = (key, label, auto, remark) => { const amt = O(key, auto); if (!auto && !ovr[key]) return; earnings.push({ key, label, auto, amount: amt, autoRemark: remark, remark: R_(key, remark), overridden: amt !== auto }); };
    addE('fuel', '出差油資費補助', trip.fuel, km ? `${km} 公里 ÷ ${tc.kmPerL} 公里/公升 × ${tc.price} 元` : '');
    addE('toll', '過路費', toll, trips ? `出差 ${trips} 天` : '');
    addE('maint', '出差私車保養補助', trip.maint, km ? `${km} 公里 × ${tc.maintPerKm} 元` : '');
    extras.forEach(x => earnings.push(x));

    // 應扣
    const deductions = [];
    const addD = (key, label, auto, remark) => { const amt = O(key, auto); deductions.push({ key, label, auto, amount: amt, autoRemark: remark, remark: R_(key, remark), overridden: amt !== auto }); };
    const deps = Math.min(3, +emp.deps || 0);
    const I = insured(emp);
    addD('labor', '勞保自付額', laborDue(I.labor, S, S.laborEmp), '');
    addD('health', '健保自付額', Math.round(I.health * S.healthRate / 100 * S.healthEmp / 100) * (1 + deps), deps ? `本人＋${deps} 眷屬` : '');
    if (+emp.selfPension) addD('pension', '勞退自提', Math.round(I.pension * (+emp.selfPension) / 100), `${emp.selfPension}%`);
    const latePropCap = lateMin * R / 60;
    const lateAmt = (!lateOver || S.lateDeductOver === false) ? 0 : Math.round(S.lateMode === 'prop' ? latePropCap : Math.min(lateMin * (+S.latePerMin || 0), latePropCap));
    addD('late', '遲到早退', lateAmt, lateMin ? (lateOver ? `${lateMin} 分鐘` : `${lateMin} 分鐘（${lateFree} 分鐘內不扣）`) : '');
    const leaveRemark = Object.entries(leaveList).map(([k, v]) => `${k}：${v.join('、')}`).join('；');
    addD('leave', '請假', Math.round(unpaidH * R) + Math.round(halfH * R * 0.5), leaveRemark);
    ((rec && rec.deducts) || []).forEach((x, idx) => deductions.push({ key: 'd' + idx, idx, label: x.label, amount: +x.amount || 0, remark: x.remark || '', extra: true }));

    if (capMin > (+S.otCap || 46) * 60) flags.push(`本月延長工時 ${dur(capMin)}，超過每月 ${S.otCap} 小時上限（§32）`);
    usedScheds.forEach(v => schedInfo(v).warn.forEach(w => flags.push(`班表 ${schedLabel(v)}：${w}`)));
    const noPunch = rows.filter(r => r.warn.includes('無打卡紀錄，請填假別')).map(r => `${+r.d.slice(5, 7)}/${+r.d.slice(8)}`);
    if (noPunch.length) flags.push(`${noPunch.length} 個工作日沒有打卡紀錄，請補上時間或假別：${noPunch.join('、')}`);

      labor: laborDue(I.labor, S, S.laborEr),

    if (!I.auto && I.health < sug.health) flags.push(`健保投保 ${I.health.toLocaleString()} 低於月薪對應級距 ${sug.health.toLocaleString()}`);

  }

  /* 請假判斷：假別＋時數（支援「四小時」「半天」「1天」），照顧小孩視為家庭照顧假 */
  const CN = { 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8 };
  const numOf = t => t == null ? null : (CN[t] != null ? CN[t] : (isNaN(+t) ? null : +t));
  function parseLeave(note) {
    const types = '特休|事假|病假|補休|公假|婚假|喪假|生理假|家庭照顧假|颱風假';
    let type = (new RegExp(`(${types})`).exec(note) || [])[1] || '';
    if (/顧小孩|照顧(小孩|家人|孩子)|家庭照顧/.test(note)) type = '家庭照顧假';
    if (!type || type === '颱風假' && !/請/.test(note)) { if (type === '颱風假') type = ''; }
    if (!type) return null;
    const H = '([一二兩三四五六七八]|\\d+(?:\\.\\d+)?)\\s*(小時|時|h|H|天|日)';
    let m = new RegExp(`請\\s*${H}`).exec(note) || new RegExp(`(?:${types})\\s*${H}`).exec(note) || new RegExp(H).exec(note);
    let h = 8;
    if (/半天/.test(note)) h = 4;
    if (m) { const n = numOf(m[1]); if (n != null) h = /天|日/.test(m[2]) ? n * 8 : n; }
    return { type, h: Math.max(0.5, Math.min(8, h)) };
  }

  /* 匯入打卡表：公司版「員工打卡表」與在家版「員工出勤及出差彙整表」 */
  function parsePunchRows(rows, S) {
    S = Object.assign({}, DEFAULT_SETTINGS, S || {});
    const txt = v => v == null ? '' : String(v);
    let name = '', year = 0, mon = 0, salary = 0, head = -1;
    rows.slice(0, 6).forEach(r => (r || []).forEach(c => {
      const t = txt(c);
      let m = /姓名[：:]\s*(\S+)/.exec(t); if (m) name = m[1];
      m = /(\d{2,4})\s*年\s*(\d{1,2})\s*月/.exec(t); if (m) { year = +m[1]; mon = +m[2]; if (year < 1911) year += 1911; }
      m = /薪資[：:]\s*([\d,]+)/.exec(t); if (m) salary = +m[1].replace(/,/g, '');
    }));
    head = rows.findIndex(r => (r || []).some(c => txt(c).trim() === '日期'));
    if (head < 0) throw new Error('找不到「日期」欄，請確認是打卡表格式');
    const H = rows[head].map(c => txt(c).trim());
    const col = test => H.findIndex(test);
    const C = {
      d: col(h => h === '日期'), in: col(h => h.startsWith('上班')), out: col(h => h.startsWith('下班')),
      ls: col(h => h === '午休開始'), le: col(h => h === '午休結束'), b1s: col(h => h === '外出'), b1e: col(h => h === '外出回來'),
      os: col(h => h === '加班開始'), oe: col(h => h === '加班結束'), note: col(h => h.startsWith('備註')),
      rest: col(h => h === '休息' || h.includes('休息時間') || h.includes('用餐')),
      from: col(h => h === '出發地點'), to: col(h => h === '目的地'), toll: col(h => h === '過路費'), km: col(h => h.startsWith('里程')), tnote: col(h => h === '出差備註')
    };
    const home = C.ls >= 0 || C.from >= 0;
    const toDate = v => {
      if (v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
      if (typeof v === 'number' && v > 20000) { const ms = Math.round((v - 25569) * 86400000); const dt = new Date(ms); return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`; }
      const m = /(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(txt(v)); return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : null;
    };
    // 時間欄：只取時刻（有些表的時間連同日期一起存，例如 2026/11/4 08:30）
    const toT = v => {
      if (v == null || v === '') return null;
      if (v instanceof Date) return v.getHours() * 60 + v.getMinutes();
      if (typeof v === 'number') return Math.round((v - Math.floor(v)) * 1440) % 1440;
      return toMin(txt(v));
    };
    const numv = v => { if (v == null || v === '') return null; const n = typeof v === 'number' ? v : parseFloat(txt(v).replace(/[,，]/g, '')); return isNaN(n) ? null : n; };
    const fieldRe = new RegExp((S.fieldWords || '').split(/[,，]/).filter(Boolean).join('|') || '^$');
    const mealRe = new RegExp((S.mealWords || '').split(/[,，]/).filter(Boolean).join('|') || '^$');
    const days = {};
    let lastRow = head;
    for (let i = head + 1; i < rows.length; i++) {
      const r = rows[i] || []; const d = toDate(r[C.d]); if (!d) continue;
      lastRow = i;
      const note = C.note >= 0 ? txt(r[C.note]).trim() : '';
      const day = {};
      const t = k => { const v = C[k] >= 0 ? toT(r[C[k]]) : null; if (v != null) day[k] = fmtMin(v); };
      t('in'); t('out'); t('os'); t('oe'); t('ls'); t('le'); t('b1s'); t('b1e');
      if (!day.in && !day.out) { delete day.ls; delete day.le; delete day.b1s; delete day.b1e; }
      if (C.rest >= 0) { const v = toT(r[C.rest]); if (v) day.rest = v; }
      if (note) {
        day.note = note;
        const lv = parseLeave(note); if (lv) { day.leave = lv.type; day.leaveH = lv.h; }
        if (fieldRe.test(note)) day.field = true;
        if (mealRe.test(note)) day.meal = true;
      }
      // 出差：出發地點、目的地、過路費、里程、出差備註
      if (C.to >= 0 || C.km >= 0) {
        const trip = { from: txt(at(r, C.from)).trim(), to: txt(at(r, C.to)).trim(), toll: numv(at(r, C.toll)) || 0, km: numv(at(r, C.km)) || 0, note: txt(at(r, C.tnote)).trim() };
        if (trip.to || trip.km || trip.toll) { day.trip = trip; day.field = true; if (/外食/.test(trip.note)) delete day.meal; }
      }
      if (Object.keys(day).length) days[d] = day;
    }
    const keys = Object.keys(days).sort();
    const month = year && mon ? `${year}-${pad(mon)}` : (keys[0] || '').slice(0, 7);
    Object.keys(days).forEach(k => { if (!k.startsWith(month)) delete days[k]; });
    // 油資參數：說明文字「每公升行駛 13 公里、每公升 32.7 元」；保養補助＝保養金額 ÷ 里程
    let tripCfg = null, tripSrc = null;
    if (home) {
      const all = rows.slice(lastRow + 1).map(r => (r || []).map(txt).join(' ')).join('\n');
      const fm = /每公升行駛\s*(\d+(?:\.\d+)?)\s*公里[^\n]*?每公升\s*(\d+(?:\.\d+)?)\s*元/.exec(all);
      const hr = rows.findIndex((r, i) => i > lastRow && (r || []).some(c => txt(c).includes('里程合計')));
      if (hr >= 0) {
        const hh = rows[hr].map(c => txt(c).trim()), vv = rows[hr + 1] || [];
        const pick = k => { const i = hh.findIndex(x => x.includes(k)); return i >= 0 ? numv(vv[i]) : null; };

}

let toastT;

function normTime(v) {
  v = String(v || '').trim().replace('：', ':'); if (!v) return '';
  let h, m;
  if (/^\d{1,2}:\d{1,2}$/.test(v)) [h, m] = v.split(':').map(Number);
  else if (/^\d{3,4}$/.test(v)) { h = +v.slice(0, -2); m = +v.slice(-2); }
  else if (/^\d{1,2}$/.test(v)) { h = +v; m = 0; }
  else return null;
  if (h > 23 || m > 59) return null;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function normMin(v) { v = String(v || '').trim(); if (!v) return 0; if (/^\d+:\d{1,2}$/.test(v)) { const [h, m] = v.split(':').map(Number); return h * 60 + m; } const n = parseFloat(v); return isNaN(n) ? null : Math.round(n); }

function captureFocus() { const a = document.activeElement; if (!a || !a.dataset || !a.dataset.f) return null; return { sel: Object.entries(a.dataset).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, c => '-' + c.toLowerCase())}="${CSS.escape(v)}"]`).join('') }; }
function restoreFocus(k) { if (!k) return; const el = document.querySelector(k.sel); if (el) { el.focus(); if (el.select && el.type === 'text') el.select(); } }
const md = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;

const monthEnd = m => { const [y, mm] = m.split('-').map(Number); return `${m}-${String(new Date(y, mm, 0).getDate()).padStart(2, '0')}`; };
const dh = h => { h = Math.round(h * 10) / 10; const d = Math.floor(h / 8), r = Math.round((h - d * 8) * 10) / 10; return `${d} 天${r ? ` ${r} 小時` : ''}`; };
/* 某段期間內系統紀錄的特休時數（加上系統啟用前已休） */
function usedLeaveH(emp, start, end) {
  let h = 0;
  Object.entries(st.months).forEach(([k, rec]) => { if (!k.startsWith(emp.id + '__')) return; Object.entries(rec.days || {}).forEach(([d, x]) => { if (d >= start && d <= end && x.leave === '特休') h += +(x.leaveH ?? 8); }); });
  if (emp.leavePrior && emp.leavePrior.period === start) h += +emp.leavePrior.h || 0;
  return h;
}
/* 本月的特休狀態：目前年度＋若本月有年度結束則要結算 */
function leaveInfo(emp, month) {
  if (!emp.hire) return null;
  const mStart = month + '-01', mEnd = monthEnd(month);
  const cur = P.annualLeave(emp.hire, mEnd); if (!cur) return null;
  if (cur.start) { cur.used = usedLeaveH(emp, cur.start, cur.end); cur.left = Math.max(0, cur.days * 8 - cur.used); }
  let settle = null;
  const head = P.annualLeave(emp.hire, mStart);
  if (head && head.start && head.end >= mStart && head.end <= mEnd) { settle = head; settle.used = usedLeaveH(emp, head.start, head.end); settle.left = Math.max(0, head.days * 8 - settle.used); }
  return { cur, settle };
}

function slip(emp, r) {
  const [y, m] = st.month.split('-').map(Number);
  const { E, D } = slipRows(r);
  const n = Math.max(E.length, D.length);
  const S = st.settings; let rows = '';
  for (let i = 0; i < n; i++) {
    const a = E[i], b = D[i];
    rows += `<tr><td>${a ? esc(a.label) : ''}</td><td class="amt">${a && a.amount ? money(a.amount) : ''}</td><td class="rm">${a ? esc(a.remark) : ''}</td>
      <td class="mid">${b ? esc(b.label) : ''}</td><td class="amt">${b && b.amount ? money(b.amount) : ''}</td><td class="rm">${b ? esc(b.remark) : ''}</td></tr>`;

/* 生效日：接受 2026/12/1、2026-12-01、20261201、民國 115/12/1；空白＝最早 */
function parseDate(v) {
  v = String(v || '').trim(); if (!v) return '2000-01-01';
  let m = /^(\d{2,4})[\/\-.年\s]+(\d{1,2})[\/\-.月\s]+(\d{1,2})日?$/.exec(v) || /^(\d{4})(\d{2})(\d{2})$/.exec(v);
  if (!m) return null;
  let y = +m[1], mo = +m[2], d = +m[3]; if (y < 1911) y += 1911;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

const T = PTCALC;
const isPT = e => e && e.type === 'contractor';
const ptKey = (empId, b) => `${empId}__pt__${b.start || 'x'}_${b.end || 'x'}`;
const ptBatches = emp => Object.entries(st.months).filter(([, v]) => v && v.kind === 'ptbatch' && v.emp === emp.id).map(([k, v]) => ({ key: k, b: v }));
const ptLedger = emp => { const list = ptBatches(emp); const L = T.ledger(list.map(x => x.b)); return L.map(row => ({ ...row, key: list.find(x => x.b === row.b).key })); };
const m2 = n => (n == null || n === '' ? '' : (Math.round(n * 100) / 100).toLocaleString('zh-TW', { maximumFractionDigits: 2 }));
const newPT = () => ({ id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), type: 'contractor', name: '外包 PT', title: '外包 PT', order: 90, active: true, taxRate: 5 });

  const totWage = L.reduce((t, x) => t + x.c.wage, 0), totPay = L.reduce((t, x) => t + x.c.payable, 0);
  const bal = L.length ? L[L.length - 1].closing : 0;
  const head = `<div class="emp-head"><div><h2>${esc(emp.name)}</h2><div class="meta">外包 PT・不適用勞基法工資計算，以請款期記錄工資、代墊款與發票抵稅・共 ${L.length} 期</div></div>
    <div class="kpis"><div class="kpi"><span>累計工資</span><b class="num">${money(totWage)}</b></div><div class="kpi"><span>累計應付</span><b class="num">${money(totPay)}</b></div>
    ${cur ? `<div class="kpi"><span>本期工資</span><b class="num">${m2(cur.c.wage)}</b></div><div class="kpi net"><span>本期應付</span><b class="num">${m2(cur.c.payable)}</b></div>` : ''}<div class="kpi"><span>稅金餘額</span><b class="num">${m2(bal)}</b></div></div></div>`;
  const chips = `<div class="ptchips">${[...L].reverse().map(x => `<button type="button" class="ptchip" data-act="ptsel" data-key="${esc(x.key)}" aria-current="${x.key === st.ptSel}">${esc(x.b.title || `${x.b.start}～${x.b.end}`)}<small class="num">${money(x.c.payable)}</small></button>`).join('')}
    <button type="button" class="btn small" data-act="ptadd">＋新增請款期</button></div>`;
  const body = cur ? ptBatchPanel(emp, cur) : `<section class="panel"><div class="empty"><h2>還沒有請款紀錄</h2><p>按「匯入打卡表」選外包的工資紀錄 Excel，或按「＋新增請款期」開始記錄。</p></div></section>`;
  return `<div class="layout">${roster(emp.id)}<div style="min-width:0">${head}${chips}${body}${ptHistory(emp, L)}</div></div>`;

function ptBatchPanel(emp, row) {

  return `<section class="panel"><div class="ph"><h2>請款期明細</h2>
      <div class="acts"><button type="button" class="btn small" data-act="ptx" data-key="${K}">匯出本期 Excel</button><button type="button" class="btn small ${st.del === key ? 'danger' : ''}" data-act="ptdelb" data-key="${K}">${st.del === key ? '再按一次確認刪除本期' : '刪除本期'}</button></div></div>
    <div class="form"><label>期間名稱${inp('top', 0, 'title', b.title)}</label><label>起日${inp('top', 0, 'start', dshow(b.start), 'num')}</label><label>迄日${inp('top', 0, 'end', dshow(b.end), 'num')}</label>
      <label>稅率 %${inp('top', 0, 'taxRate', b.taxRate, 'num')}</label>
      <label class="chk"><input type="checkbox" ${b.taxAdded ? 'checked' : ''} data-f="pt" data-key="${K}" data-sec="top" data-i="0" data-k="taxAdded">稅金加在應付金額裡</label></div>
    ${(b.warn || []).length ? `<ul class="flags info">${b.warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <h3 class="pth">工作紀錄<b class="num">${m2(c.perRow)}</b></h3>
    <div class="tscroll"><table class="pt"><thead><tr><th>#</th><th>日期</th><th>內容／地點</th><th>時數</th><th>工資</th><th>備註</th><th></th></tr></thead><tbody>${jobs}</tbody></table></div>
    <button type="button" class="btn small" data-act="ptrow" data-key="${K}" data-sec="jobs">＋新增工作</button>
    <h3 class="pth">代墊款<b class="num">${m2(c.reimbSum)}</b></h3>
    <div class="tscroll"><table class="pt pt-r"><thead><tr><th>#</th><th>日期</th><th>項目</th><th>備註</th><th>金額</th><th></th></tr></thead><tbody>${reimb}</tbody></table></div>
    <button type="button" class="btn small" data-act="ptrow" data-key="${K}" data-sec="reimb">＋新增代墊款</button>
    <h3 class="pth">提供的發票（抵稅）<b class="num">稅金 ${m2(c.invSum)}</b></h3>
    <div class="tscroll"><table class="pt pt-i"><thead><tr><th>#</th><th>提供日期</th><th>發票號碼</th><th>含稅金額</th><th>發票稅金</th><th>備註</th><th></th></tr></thead><tbody>${inv}</tbody></table></div>
    <button type="button" class="btn small" data-act="ptrow" data-key="${K}" data-sec="inv">＋新增發票</button>
    <h3 class="pth">本期結算</h3>
    <div class="form ptsum">

      ${ov('taxOverride', `稅金（${b.taxRate || 0}%）`, Math.round(c.wage * (+b.taxRate || 0)) / 100, b.taxOverride)}
      ${ov('reimbOverride', '代墊款合計', c.reimbSum, b.reimbOverride)}
      ${ov('payOverride', '應付總額', c.wage + (b.taxAdded ? c.tax : 0) + c.reimb, b.payOverride, b.taxAdded ? '工資＋稅金＋代墊款' : '工資＋代墊款')}
      ${ov('invTaxOverride', '發票稅金', c.invSum, b.invTaxOverride)}
      ${ov('balOverride', '期末稅金餘額', calcClosing, b.balOverride, `期初 ${m2(opening)} ＋ 發票稅金 ${m2(c.invTax)} － 稅金 ${m2(c.tax)}`)}

function ptHistory(emp, L) {
  if (!L.length) return '';
  const M = T.byMonth(L.map(x => x.b)); const Y = {};
  Object.entries(M).forEach(([ym, v]) => { const y = ym.slice(0, 4); const o = Y[y] = Y[y] || { wage: 0, reimb: 0, count: 0 }; o.wage += v.wage; o.reimb += v.reimb; o.count += v.count; });
  const rows = [...L].reverse().map(x => `<tr class="${x.key === st.ptSel ? 'sel' : ''}"><td><button type="button" class="btn ghost small" style="color:var(--ink);padding-left:0" data-act="ptsel" data-key="${esc(x.key)}">${esc(x.b.title)}</button></td><td class="num">${x.c.count}</td><td class="num">${m2(x.c.wage)}</td><td class="num">${m2(x.c.tax)}</td><td class="num">${m2(x.c.reimb)}</td><td class="num net">${m2(x.c.payable)}</td><td class="num">${m2(x.c.invTax)}</td><td class="num">${m2(x.closing)}</td></tr>`).join('');
  const ys = Object.keys(Y).sort().reverse().map(y => `<tr><td>${y} 年（民國 ${+y - 1911}）</td><td class="num">${Y[y].count}</td><td class="num">${money(Y[y].wage)}</td><td class="num">${money(Y[y].reimb)}</td><td class="num net">${money(Y[y].wage + Y[y].reimb)}</td></tr>`).join('');
  const tw = L.reduce((t, x) => t + x.c.wage, 0), tr = L.reduce((t, x) => t + x.c.reimb, 0), tp = L.reduce((t, x) => t + x.c.payable, 0), tt = L.reduce((t, x) => t + x.c.tax, 0);
  return `<section class="panel"><div class="ph"><h2>歷年統計</h2><div class="acts"><button type="button" class="btn small primary" data-act="ptxall">匯出全部紀錄 Excel</button></div></div>
    <h3 class="pth">各請款期</h3>
    <div class="tscroll"><table class="sum"><thead><tr><th>期間</th><th>筆數</th><th>工資</th><th>稅金</th><th>代墊款</th><th>應付總額</th><th>發票稅金</th><th>稅金餘額</th></tr></thead><tbody>${rows}

function ptMonthRows(month) {
  return empList().filter(isPT).map(e => {

      const endM = (b.end || '').slice(0, 7), lump = b.wageOverride != null && b.wageOverride !== '';
      (b.jobs || []).forEach(j => { const ym = (j.date || b.end || '').slice(0, 7); if (ym === month) { items.push(j.desc); if (!lump) wage += +j.amount || 0; } });

async function importFiles(files) {
  if (typeof XLSX === 'undefined') { toast('Excel 讀取元件尚未載入，請重新整理'); return; }
  const done = [], fail = [];
  for (const file of files) {
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false });
      let parsed = null;
      for (const name of wb.SheetNames) { try { const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null }); parsed = P.parsePunchRows(rows, st.settings); if (parsed.name) break; } catch (x) { parsed = null; } }
      if (!parsed || !parsed.name) { const pr = importPTBook(wb, file.name); if (pr) { done.push(`${pr.emp.name} ${pr.count} 個請款期`); continue; } throw new Error('找不到「姓名：」或日期欄，也不是外包請款紀錄'); }
      let emp = empList().find(x => x.name === parsed.name);
      if (!emp) {
        emp = P.newEmployee(parsed.name); emp.order = empList().length + 1;
        if (parsed.salary) { emp.items[0].amount = parsed.salary; emp.items = emp.items.filter(i => i.kind !== 'attendance'); }
        const wage = parsed.salary || 30000; emp.labor = P.bracket(P.LABOR_TABLE, wage); emp.health = emp.pension = P.bracket(P.HEALTH_TABLE, wage);
        const co = P.schedFor(null, parsed.month + '-01', st.settings);
        if (parsed.home && parsed.typical && parsed.typical.in && parsed.typical.out) {
          const t = parsed.typical; emp.schedMode = 'custom'; emp.scheds = [{ from: '2000-01-01', start: t.in, ls: t.ls || co.ls, le: t.le || co.le, ...(t.b1s && t.b1e ? { b1s: t.b1s, b1e: t.b1e } : {}), end: t.out, ot: t.out }];
        } else if (parsed.typicalIn && parsed.typicalOut && (parsed.typicalIn !== co.start || parsed.typicalOut !== co.end)) {
          emp.schedMode = 'custom'; emp.scheds = [{ ...co, from: '2000-01-01', start: parsed.typicalIn, end: parsed.typicalOut, ot: parsed.typicalOut }];
        } else emp.schedMode = 'company';
        st.emps[emp.id] = emp; save('employees/' + emp.id);
      }
      const rec = ensureRec(emp.id, parsed.month); rec.days = parsed.days;
      rec.format = parsed.home ? 'home' : 'office';
      if (parsed.home) { rec.tripCfg = Object.assign({}, rec.tripCfg || {}, Object.fromEntries(Object.entries(parsed.tripCfg || {}).filter(([, v]) => v != null))); rec.tripSrc = parsed.tripSrc || null; rec.typical = parsed.typical || null; }
      else { delete rec.tripSrc; delete rec.typical; }
      save('months/' + recKey(emp.id, parsed.month));
      st.month = parsed.month; st.sel = emp.id;
      done.push(`${emp.name} ${roc(parsed.month)}${parsed.home ? '（在家版）' : ''}`);
    } catch (err) { fail.push(`${file.name}：${err.message}`); }
  }
  st.tab = 'pay'; render();
  toast([done.length ? '已匯入 ' + done.join('、') : '', fail.length ? '無法讀取 ' + fail.join('；') : ''].filter(Boolean).join('。'));
}

const BLUE = '2A47A6', INK = '17222A', MUTED = '5B686E', GRID = 'D3DCDB', HEAD = 'E8EDEC';
const XFONT = '微軟正黑體';
const slipRows = r => ({ E: r.earnings.filter(x => x.amount || !x.extra || x.attGone), D: r.deductions.filter(x => x.amount || !x.extra) });

const makeTag = () => { const t = new Date(); return `${t.getFullYear() - 1911}.${t.getMonth() + 1} 月`; };

/* 薪資單（與線上相同版面）：A 應支 B 金額 C REMARK｜D 應扣 E 金額 F REMARK */
function slipSheet(emp, r) {
  const [y, m] = st.month.split('-').map(Number); const S = st.settings;
  const { E, D } = slipRows(r); const n = Math.max(E.length, D.length);
  const ws = {}; const merges = [];
  const line = (style, color) => ({ style, color: { rgb: color } });
  const thin = line('thin', GRID), black = line('thin', INK), bold = line('medium', INK);
  const put = (row, col, v, s = {}) => {
    const ref = XLSX.utils.encode_cell({ r: row, c: col });
    const cell = { v: v ?? '', t: typeof v === 'number' ? 'n' : 's' };
    cell.s = { font: { name: XFONT, sz: 10.5, color: { rgb: INK }, ...(s.font || {}) }, alignment: { horizontal: 'left', vertical: 'center', wrapText: true, indent: 1, ...(s.alignment || {}) }, border: Object.fromEntries(Object.entries(s.border || {}).filter(([, v]) => v)) };
    if (s.fill) cell.s.fill = { patternType: 'solid', fgColor: { rgb: s.fill } };
    if (typeof v === 'number') cell.s.numFmt = '#,##0';
    ws[ref] = cell;
  };
  // 外框：左 A、右 F；中間 C|D 一條直線
  const bd = (c, top, bottom) => {
    const b = { top: top || thin, bottom: bottom || thin };
    if (c === 0) b.left = bold; if (c === 5) b.right = bold; if (c === 2) b.right = black; if (c === 3) b.left = black;
    return b;
  };
  let R = 0;
  // 標題列
  put(R, 0, `職稱：${emp.title || ''}`, { border: { top: bold, left: bold, bottom: black } }); put(R, 1, '', { border: { top: bold, bottom: black } });
  put(R, 2, `${y - 1911}/${String(m).padStart(2, '0')}/薪資`, { font: { sz: 16 }, alignment: { horizontal: 'center' }, border: { top: bold, bottom: black } }); put(R, 3, '', { border: { top: bold, bottom: black } });
  put(R, 4, `姓名：${emp.name}`, { alignment: { horizontal: 'right' }, border: { top: bold, right: bold, bottom: black } }); put(R, 5, '', { border: { top: bold, right: bold, bottom: black } });
  merges.push({ s: { r: R, c: 0 }, e: { r: R, c: 1 } }, { s: { r: R, c: 2 }, e: { r: R, c: 3 } }, { s: { r: R, c: 4 }, e: { r: R, c: 5 } });
  R++;
  // 表頭
  ['應支薪資', '金額', 'REMARK', '應扣金額', '金額', 'REMARK'].forEach((h, c) => put(R, c, h, { fill: HEAD, font: { sz: 10, bold: true }, alignment: { horizontal: c === 1 || c === 4 ? 'right' : 'left' }, border: bd(c, black) }));
  R++;
  // 項目
  for (let i = 0; i < n; i++) {
    const a = E[i], b = D[i];
    put(R, 0, a ? a.label : '', { border: bd(0) });
    put(R, 1, a && a.amount ? a.amount : '', { font: { color: { rgb: BLUE } }, alignment: { horizontal: 'right' }, border: bd(1) });
    put(R, 2, a ? a.remark : '', { font: { sz: 9, color: { rgb: MUTED } }, border: bd(2) });
    put(R, 3, b ? b.label : '', { border: bd(3) });
    put(R, 4, b && b.amount ? b.amount : '', { font: { color: { rgb: BLUE } }, alignment: { horizontal: 'right' }, border: bd(4) });
    put(R, 5, b ? b.remark : '', { font: { sz: 9, color: { rgb: MUTED } }, border: bd(5) });
    R++;
  }
  // 合計
  [['合計'], [r.gross], [''], ['合計'], [r.ded], ['']].forEach(([v], c) => put(R, c, v, { font: { bold: true, color: { rgb: c === 1 || c === 4 ? BLUE : INK } }, alignment: { horizontal: c === 1 || c === 4 ? 'right' : 'left' }, border: bd(c, black, black) }));
  R++;
  // 實發
  for (let c = 0; c < 6; c++) put(R, c, '', { border: { left: c === 0 ? bold : undefined, right: c === 5 ? bold : undefined, bottom: thin } });
  put(R, 0, '應支薪資－應扣金額＝', { alignment: { horizontal: 'right' }, border: { left: bold, bottom: thin } });
  put(R, 4, r.net, { font: { sz: 18, bold: true, color: { rgb: BLUE } }, alignment: { horizontal: 'right' }, border: { right: bold, bottom: thin } }); put(R, 5, '', { border: { right: bold, bottom: thin } });
  merges.push({ s: { r: R, c: 0 }, e: { r: R, c: 3 } }, { s: { r: R, c: 4 }, e: { r: R, c: 5 } });
  const netRow = R; R++;
  // 備註
  const note = (getRec(emp.id, st.month) || {}).note || '';
  put(R, 0, '備註', { font: { sz: 9.5, color: { rgb: MUTED } }, alignment: { vertical: 'top' }, border: { left: bold, bottom: thin } });
  put(R, 1, note, { alignment: { vertical: 'top' }, border: { bottom: thin } });
  for (let c = 2; c < 6; c++) put(R, c, '', { border: { bottom: thin, right: c === 5 ? bold : undefined } });
  merges.push({ s: { r: R, c: 1 }, e: { r: R, c: 5 } });
  const noteRow = R; R++;
  // 簽核
  const sg = { font: { sz: 9.5, color: { rgb: MUTED } } };
  put(R, 0, `主管：${S.manager}`, { ...sg, border: { left: bold, bottom: bold } }); put(R, 1, '', { border: { bottom: bold } });
  put(R, 2, `會計：${S.accountant}`, { ...sg, alignment: { horizontal: 'center' }, border: { bottom: bold } }); put(R, 3, '', { border: { bottom: bold } });
  put(R, 4, `製表：${makeTag()}`, { ...sg, alignment: { horizontal: 'right' }, border: { right: bold, bottom: bold } }); put(R, 5, '', { border: { right: bold, bottom: bold } });
  merges.push({ s: { r: R, c: 0 }, e: { r: R, c: 1 } }, { s: { r: R, c: 2 }, e: { r: R, c: 3 } }, { s: { r: R, c: 4 }, e: { r: R, c: 5 } });

  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: R, c: 5 } });
  ws['!merges'] = merges;
  ws['!cols'] = [{ wch: 13 }, { wch: 10 }, { wch: 25 }, { wch: 12 }, { wch: 9 }, { wch: 19 }];
  const rows = [{ hpt: 34 }, { hpt: 22 }];
  for (let i = 0; i < n; i++) { const a = E[i], b = D[i]; const len = Math.max((a?.remark || '').length / 13, (b?.remark || '').length / 10, 1); rows.push({ hpt: Math.max(24, Math.ceil(len) * 14 + 8) }); }
  rows.push({ hpt: 24 }); rows[netRow] = { hpt: 40 };
  const noteLines = note.split('\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / 40)), 0);
  rows[noteRow] = { hpt: Math.max(30, noteLines * 15 + 10) }; rows[noteRow + 1] = { hpt: 24 };
  ws['!rows'] = rows;
  ws['!margins'] = { left: 0.5, right: 0.5, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 };
  return ws;
}
function daysSheet(emp, r) {

  Object.keys(ws).forEach(k => { if (k[0] === '!') return; const { r: row, c } = XLSX.utils.decode_cell(k); ws[k].s = { font: { name: XFONT, sz: row === 0 ? 14 : 10.5, bold: row <= 1, color: { rgb: c === 7 && row > 1 ? BLUE : INK } }, numFmt: '#,##0', ...(row === 1 ? { fill: { patternType: 'solid', fgColor: { rgb: HEAD } } } : {}) }; });
  ws['!cols'] = [{ wch: 10 }, { wch: 16 }, ...Array(9).fill({ wch: 11 })]; XLSX.utils.book_append_sheet(wb, ws, '總表');
  list.forEach(e => { const r = calc(e, st.month); XLSX.utils.book_append_sheet(wb, slipSheet(e, r), `${e.name}薪資單`.slice(0, 31)); XLSX.utils.book_append_sheet(wb, daysSheet(e, r), `${e.name}出勤`.slice(0, 31)); });
  saveWb(wb, `${ymTag()}薪資總表.xlsx`);
}

/* PDF：把線上薪資單以淺色版面轉成 A4 */
const loaded = {};
const loadScript = src => loaded[src] || (loaded[src] = new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { delete loaded[src]; no(new Error('load')); }; document.head.appendChild(s); }));
/* 依序嘗試多個來源，任一個載入成功即可 */
async function loadAny(urls, ready) {
  for (const u of urls) { if (ready()) return; try { await loadScript(u); if (ready()) return; } catch (e) { console.warn('載入失敗', u); } }
  if (!ready()) throw new Error('load');
}
async function pdfLibs() {
  await Promise.all([
    loadAny(['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'], () => typeof window.html2canvas === 'function'),
    loadAny(['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'], () => !!(window.jspdf && window.jspdf.jsPDF))
  ]);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
}
/* 備用：元件載不到時，用瀏覽器列印另存 PDF（只印薪資單） */
function printSlips(list) {
  const area = document.createElement('div'); area.id = 'printArea';
  area.innerHTML = list.map(e => `<div class="print-page">${slip(e, calc(e, st.month))}</div>`).join('');
  document.body.appendChild(area); document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); area.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(done, 1000); }, 50);
}
async function slipCanvas(emp, r) {
  const stage = document.createElement('div'); stage.className = 'pdf-stage';
  stage.innerHTML = slip(emp, r); document.body.appendChild(stage);
  try { return await html2canvas(stage, { scale: 2, backgroundColor: '#ffffff', logging: false }); }
  finally { stage.remove(); }
}
function addSlipPage(pdf, canvas, first) {
  if (!first) pdf.addPage();
  const W = 210, H = 297, M = 12; let w = W - M * 2, h = canvas.height * w / canvas.width;
  if (h > H - M * 2) { h = H - M * 2; w = canvas.width * h / canvas.height; }
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', (W - w) / 2, M, w, h);
}
async function exportPdf(all) {
  const list = all ? empList().filter(e => getRec(e.id, st.month)) : [st.emps[st.sel]];
  if (!list.length || !list[0]) { toast('本月沒有可匯出的薪資單'); return; }
  toast('正在產生 PDF…');
  try { await pdfLibs(); } catch (e) { toast('改用列印視窗：目的地選「另存為 PDF」'); printSlips(list); return; }
  const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  for (let i = 0; i < list.length; i++) addSlipPage(pdf, await slipCanvas(list[i], calc(list[i], st.month)), i === 0);
  pdf.save(all ? `${ymTag()}薪資單-全員.pdf` : `${ymTag()}薪資-${list[0].name}.pdf`);
  toast('PDF 已下載');
}

render();
</script>
